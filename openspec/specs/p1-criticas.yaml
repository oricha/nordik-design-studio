name: "P1 - Funcionalidades Críticas (2-3 semanas)"
description: "Prioridad 1: Reparar funcionalidad de filtros, crear páginas de detalle y mejorar formulario"
priority: critical
effort: large
status: proposed

epics:
  - id: "1.1"
    name: "Funcionalidad de Filtros y Búsqueda"
    description: "8 features para búsqueda avanzada y filtros dinámicos"
    features:
      - id: "F1.1.1"
        name: "Búsqueda por Texto de Proyecto"
        description: "Implementar buscador que filtre proyectos por nombre, ubicación o características"
        effort: small
        status: proposed
        acceptance:
          - "Input de búsqueda visible en header"
          - "Filtra proyectos en tiempo real"
          - "Muestra 'No hay resultados' cuando aplica"
          - "Busca en: nombre, ciudad, tipo de proyecto"

      - id: "F1.1.2"
        name: "Filtros Dinámicos con Rango de Precios"
        description: "Rango de precios debe actualizarse según productos filtrados"
        effort: medium
        status: proposed
        acceptance:
          - "Rango de precios actualiza al filtrar por tipo"
          - "Valores min/max recalculan dinámicamente"
          - "Input numéricos funcionan con valores actuales"

      - id: "F1.1.3"
        name: "Filtro por Número de Habitaciones"
        description: "Agregar filtro para seleccionar cantidad de dormitorios/baños"
        effort: small
        status: proposed
        acceptance:
          - "Checkboxes/select para 1, 2, 3, 4+ habitaciones"
          - "Filtros combinables (múltiple selección)"
          - "Actualiza resultados en tiempo real"

      - id: "F1.1.4"
        name: "Filtro por Eficiencia Energética"
        description: "Filtro por categoría energética (A, B, C, D, etc.)"
        effort: medium
        status: proposed
        acceptance:
          - "Mostrar etiqueta energética (A-F) en tarjetas"
          - "Filtro por categoría seleccionada"
          - "Ordenable: mejor a peor eficiencia"

      - id: "F1.1.5"
        name: "Filtro por Tiempo de Entrega"
        description: "Filtrar por velocidad de entrega (0-3 meses, 3-6 meses, 6+ meses)"
        effort: small
        status: proposed
        acceptance:
          - "3 rangos de tiempo seleccionables"
          - "Valor de entregas mostrado en tarjetas"
          - "Actualiza resultados dinámicamente"

      - id: "F1.1.6"
        name: "Vista Grid vs. Lista"
        description: "Alternar entre visualización en grid (3 cols) o lista (1 fila)"
        effort: small
        status: proposed
        acceptance:
          - "2 botones togglables: Grid/Lista"
          - "Estado persiste en sesión"
          - "Responsive en ambas vistas"

      - id: "F1.1.7"
        name: "Sidebar Persistente de Filtros"
        description: "Panel lateral con todos los filtros activos visibles, opción 'Limpiar todo'"
        effort: medium
        status: proposed
        acceptance:
          - "Sidebar visible desktop (mobile: collapsible)"
          - "Muestra filtros activos con X para remover"
          - "Botón 'Limpiar Filtros' resetea todo"
          - "Resultado contador: 'Mostrando 12 de 240'"

      - id: "F1.1.8"
        name: "Ordenamiento Extendido"
        description: "Agregar opciones: precio (menor/mayor), tamaño, eficiencia, tiempo entrega"
        effort: small
        status: proposed
        acceptance:
          - "Dropdown con 5+ opciones de ordenamiento"
          - "Ascendente/Descendente seleccionable"
          - "Estado refleja en URL"

  - id: "1.2"
    name: "Páginas de Detalle de Producto"
    description: "8 features para crear y mejorar páginas de detalle de proyectos"
    features:
      - id: "F1.2.1"
        name: "Crear Ruta /proyecto/{slug}"
        description: "Crear página individual para cada proyecto con URL amigable"
        effort: small
        status: proposed
        acceptance:
          - "URLs: /proyecto/kuusamo, /proyecto/tampere, etc."
          - "404 si proyecto no existe"
          - "Breadcrumb: Home > Proyectos > [Nombre]"

      - id: "F1.2.2"
        name: "Galería de Imágenes (8-10+ fotos)"
        description: "Lightbox interactivo con mínimo 8 imágenes por proyecto"
        effort: medium
        status: proposed
        acceptance:
          - "Lightbox con navegación (prev/next)"
          - "Zoom en imagen"
          - "Thumbnails abajo (1-2 lineas)"
          - "Optimizadas para carga rápida"

      - id: "F1.2.3"
        name: "Especificaciones Técnicas Completas"
        description: "Sección con specs: paneles SIP, acabados, personalización"
        effort: medium
        status: proposed
        acceptance:
          - "Especificación de panel SIP: espesor (cm), R-value (insulación)"
          - "Cantidad: dormitorios, baños, área útil"
          - "Acabados incluidos (techo, piso, pintura, puertas)"
          - "Opciones de personalización disponibles"
          - "Certificaciones/estándares (ISO, energía, etc.)"

      - id: "F1.2.4"
        name: "Timeline de Construcción y Entrega"
        description: "Mostrar fases constructivas (diseño → fabricación → entrega) con duraciones"
        effort: medium
        status: proposed
        acceptance:
          - "Línea de tiempo visual (4-6 hitos)"
          - "Fechas estimadas o rangos (ej: '6-8 semanas')"
          - "Descripción de cada fase"
          - "Opción para customización (agrega tiempo)"

      - id: "F1.2.5"
        name: "Descripción de Opciones de Servicio"
        description: "Diferenciar: solo paneles SIP vs. llave en mano vs. reforma"
        effort: small
        status: proposed
        acceptance:
          - "3 cards o tabs: Opciones de Servicio"
          - "Descripción clara de cada una"
          - "Diferencia de precio explícita"
          - "Incluidos/excluidos en cada opción"

      - id: "F1.2.6"
        name: "Proceso Constructivo Explicado"
        description: "Sección con descripción de cómo se construye, ventajas de SIP"
        effort: medium
        status: proposed
        acceptance:
          - "4-6 pasos del proceso con imágenes/íconos"
          - "Explicación de por qué SIP es mejor"
          - "Comparativa con construcción tradicional (tiempo/costo)"

      - id: "F1.2.7"
        name: "CTA Contextual: Solicitar Cotización"
        description: "Botón prominente en detalle de proyecto que abre formulario pre-filled"
        effort: small
        status: proposed
        acceptance:
          - "Botón grande (primary color) en header + final de página"
          - "Click abre modal/página con formulario"
          - "Campo 'Proyecto' pre-filled con nombre"
          - "CTAs flotante en mobile"

      - id: "F1.2.8"
        name: "Proyectos Relacionados"
        description: "Al final, mostrar 3-4 proyectos similares"
        effort: small
        status: proposed
        acceptance:
          - "4 cards de proyectos similares"
          - "Enlace directo a detalle de cada uno"
          - "'Más como este' o 'También te puede interesar'"

  - id: "1.3"
    name: "Reparar Enlaces Rotos"
    description: "2 features para validar y crear enlaces faltantes"
    features:
      - id: "F1.3.1"
        name: "Validar Todos los Enlaces a Proyectos"
        description: "Auditar todos los links en catalog que deberían ir a detalle"
        effort: small
        status: proposed
        acceptance:
          - "Todos los proyectos (Saariselkä, Rovaniemi, Inari, etc.) tienen link funcional"
          - "Enlaces en tarjetas van a /proyecto/{slug}"
          - "Verificación: 0 enlaces rotos"

      - id: "F1.3.2"
        name: "Crear Detalle para Proyectos Sin Página"
        description: "Crear página /proyecto/{slug} para los 3-5 proyectos faltantes"
        effort: medium
        status: proposed
        acceptance:
          - "Mínimo 8 imágenes por proyecto"
          - "Especificaciones completas"
          - "CTA de cotización"

  - id: "1.4"
    name: "Mejorar Formulario de Contacto"
    description: "9 features para enhance el formulario de contacto y validación"
    features:
      - id: "F1.4.1"
        name: "Tipo de Proyecto: Múltiple Selección"
        description: "Cambiar 'Tipo de Proyecto' a checkboxes"
        effort: small
        status: proposed
        acceptance:
          - "Checkboxes en lugar de radio buttons"
          - "Mínimo 1, máximo ilimitado"
          - "Validación: debe seleccionar al menos 1"

      - id: "F1.4.2"
        name: "Campo: Presupuesto Aproximado"
        description: "Agregar select con rangos: <€50k, €50-100k, €100-200k, €200k+"
        effort: small
        status: proposed
        acceptance:
          - "Dropdown con 4 rangos"
          - "Campo obligatorio"
          - "Incluido en confirmación de envío"

      - id: "F1.4.3"
        name: "Campo: Ubicación del Proyecto"
        description: "Agregar select/input para país/región donde se construirá"
        effort: small
        status: proposed
        acceptance:
          - "Dropdown: España, Portugal, Francia, otros"
          - "Opcional"
          - "Incluido en email de lead"

      - id: "F1.4.4"
        name: "Campo: ¿Busca Financiamiento?"
        description: "Checkbox 'Interesado en opciones de financiamiento'"
        effort: small
        status: proposed
        acceptance:
          - "Checkbox simple sí/no"
          - "Condicional: si sí, muestra opciones de entidades"
          - "Datos enviados al CRM"

      - id: "F1.4.5"
        name: "Casilla de Términos y Privacidad"
        description: "Agregar checkbox obligatorio para GDPR compliance"
        effort: small
        status: proposed
        acceptance:
          - "Checkbox con link a /privacidad y /terminos"
          - "Obligatorio para envío"
          - "Validación visible en frontend + backend"

      - id: "F1.4.6"
        name: "Validación Visible y Mensajes de Error"
        description: "Mostrar errores en tiempo real (email inválido, teléfono, etc.)"
        effort: medium
        status: proposed
        acceptance:
          - "Validación onBlur/onChange"
          - "Mensajes de error rojo debajo de campo"
          - "Submit deshabilitado si hay errores"
          - "Indicador visual de campos obligatorios"

      - id: "F1.4.7"
        name: "Mensaje de Éxito Post-Envío"
        description: "Modal o página de confirmación tras envío exitoso"
        effort: small
        status: proposed
        acceptance:
          - "Modal con 'Gracias, tu solicitud fue enviada'"
          - "Número de seguimiento o ID generado"
          - "Información: 'Te contactaremos en 24-48h'"
          - "Botón: 'Volver a inicio' o 'Explorar más proyectos'"

      - id: "F1.4.8"
        name: "Autorespuesta por Email"
        description: "Email automático enviado al cliente confirmando recepción"
        effort: medium
        status: proposed
        acceptance:
          - "Email con resumen de solicitud"
          - "Número/ID de ticket único"
          - "SLA: contacto en 24-48 horas"
          - "Link a FAQ o recursos útiles"

      - id: "F1.4.9"
        name: "Opción de Subir Documentos/Planos"
        description: "Agregar file upload para referencias, planos, imágenes"
        effort: medium
        status: proposed
        acceptance:
          - "Input file: PDF, JPG, PNG, max 10MB"
          - "Múltiple archivos (3-5 máximo)"
          - "Preview de archivos antes de envío"
          - "Almacenaje seguro en backend"

  - id: "1.5"
    name: "Actualizar Contacto y Ubicación"
    description: "5 features para mejorar información de contacto"
    features:
      - id: "F1.5.1"
        name: "Mostrar Múltiples Ubicaciones"
        description: "Si NordiK tiene varias oficinas, mostrar todas"
        effort: small
        status: proposed
        acceptance:
          - "Card por cada oficina con dirección"
          - "Mapa interactivo mostrando ubicaciones"
          - "Horarios de atención"
          - "Número de teléfono específico por región"

      - id: "F1.5.2"
        name: "Números Telefónicos por País/Región"
        description: "Teléfono específico para España, Portugal, Francia, etc."
        effort: small
        status: proposed
        acceptance:
          - "Números con código país (+34, +33, +351, etc.)"
          - "WhatsApp disponible (si aplica)"
          - "Link tel: activo en móviles"

      - id: "F1.5.3"
        name: "Horarios de Atención Claros"
        description: "Mostrar horarios por zona"
        effort: small
        status: proposed
        acceptance:
          - "Horarios por ubicación"
          - "Indicador: 'Abierto ahora' (real-time)"
          - "Zona horaria visible"

      - id: "F1.5.4"
        name: "Chat en Vivo o Chatbot"
        description: "Integrar chat en tiempo real o bot inicial"
        effort: large
        status: proposed
        acceptance:
          - "Widget en esquina bottom-right"
          - "Bot para FAQ iniciales o escalation a agente"
          - "Disponibilidad de agentes en horario laboral"
          - "Historial de chat guardado"

      - id: "F1.5.5"
        name: "Mapa Interactivo de Oficinas"
        description: "Mapa (Google Maps) con pinpoints de cada ubicación"
        effort: medium
        status: proposed
        acceptance:
          - "Mapa responsive"
          - "Pinpoint clickeable → detalles de oficina"
          - "Link 'Cómo llegar' directo a Google Maps"
          - "Información: dirección, teléfono, horario en popup"

metrics:
  - "0 enlaces rotos en catálogo"
  - "Todos los proyectos tienen página de detalle funcional"
  - "Filtros dinámicos ajustan rango de precios en tiempo real"
  - "Formulario tiene validación visible"
  - "Tasa de conversión de contacto: 1-2%"

timeline:
  start: "2026-05-01"
  end: "2026-05-21"
  duration_weeks: 3
